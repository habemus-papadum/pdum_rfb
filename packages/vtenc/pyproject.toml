# habemus-papadum-vtenc (import: pdum.vtenc) — host NV12 -> H.264 Annex B via Apple's
# VideoToolbox, no PyAV. The macOS counterpart of habemus-papadum-nvenc; a workspace
# member of pdum_rfb.
#
# Build/publish via scripts/publish.sh (which runs build-wheel.sh + delocate). A build
# needs only the Xcode Command Line Tools (clang + the macOS SDK frameworks); the wheel
# needs nothing beyond macOS itself (all frameworks are system-provided).
[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "habemus-papadum-vtenc"
# Kept in lockstep with habemus-papadum-rfb by the release workflow (scripts/_versioning.py);
# between releases the version carries a "+dev" marker. Do not hand-edit.
version = "0.2.1+dev"
description = "Zero-PyAV macOS H.264 encode (Apple VideoToolbox) for pdum.rfb"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Nehal Patel" }]
keywords = ["videotoolbox", "h264", "metal", "mlx", "macos", "video", "encoder"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Repository = "https://github.com/habemus-papadum/pdum_rfb"
Documentation = "https://github.com/habemus-papadum/pdum_rfb"

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.21"
cmake.build-type = "Release"
# Ships the pdum.vtenc namespace package; the CMake install drops the _vtenc .so into
# pdum/vtenc/. No pdum/__init__.py -> PEP 420 namespace shared with pdum.rfb / pdum.nvenc.
wheel.packages = ["src/pdum"]

# Editable installs auto-rebuild the native extension when a source file (.mm) changes, so
# editing the binding no longer leaves a stale _vtenc .so behind (the manual-reinstall footgun
# that once stranded submit()/flush_pipeline()). editable.rebuild needs a persistent build-dir;
# {wheel_tag} keys it per Python/platform so builds don't collide. Dev-only: a `pip wheel` /
# released build ignores editable.rebuild (build-dir just makes that CMake build incremental).
build-dir = "build/{wheel_tag}"
editable.rebuild = true
