[project]
name = "habemus-papadum-rfb"
version = "0.3.0+dev"
description = "Remote Frame Buffer"
readme = "README.md"
license = { file = "LICENSE" }
keywords = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

authors = [
    { name = "Nehal Patel", email = "nehal@alum.mit.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.0",
    "pillow>=12.2.0",
    "websockets>=16.0",
]

[project.urls]
Homepage = "https://github.com/habemus-papadum/pdum_rfb"
Repository = "https://github.com/habemus-papadum/pdum_rfb"
Documentation = "https://github.com/habemus-papadum/pdum_rfb"

[project.scripts]
pdum-rfb = "pdum.rfb.cli:app"

[project.optional-dependencies]
h264 = [
    "av>=17.1.0",
]
# Hardware H.264 via NVIDIA NVENC. The Python requirement is the same PyAV wheel
# as [h264] (its bundled ffmpeg ships the h264_nvenc encoder); the actual GPU
# requirement is a host NVIDIA driver + an NVENC-capable card, which pip cannot
# install. NVIDIA's own PyNvVideoCodec is intentionally NOT used: it publishes no
# cp314 wheel and no sdist, so it cannot install on Python 3.14 (no source fallback).
# Availability is verified at runtime by pdum.rfb.encoders.nvenc.nvenc_available().
nvenc = [
    "av>=17.1.0",
]
# Zero-copy CUDA->NVENC: a CuPy/DLPack GPU buffer is fed straight to h264_nvenc with
# no host copy (~2.4-4.3x lower latency; see docs/gpu_zerocopy.md). Two requirements:
#   1. CuPy matching your CUDA toolkit -> pick the extra below (these install today);
#   2. PyAV >= 18 (the encode-side hw_frames_ctx wiring). PyAV 18 is NOT on PyPI yet,
#      so install it via scripts/install-gpu.sh (source build, commit-pinned) or a
#      prebuilt self-contained wheel (scripts/build-cuda-av-wheel.sh -> GitHub release).
#      WHEN PyAV 18.0 SHIPS ON PyPI: add "av>=18" to each extra below and GPU support
#      becomes a one-step `pip install habemus-papadum-rfb[gpu-cuda13]`.
gpu-cuda13 = [
    "cupy-cuda13x>=14 ; sys_platform == 'linux' and platform_machine == 'x86_64'",  # CUDA 13.x
]
gpu-cuda12 = [
    "cupy-cuda12x>=13 ; sys_platform == 'linux' and platform_machine == 'x86_64'",  # CUDA 12.x
]
# Alternative GPU H.264/HEVC backend via NVIDIA's Video Codec SDK encoder instead of
# PyAV/ffmpeg — the sibling package habemus-papadum-nvenc (import pdum.nvenc), built
# from packages/nvenc/ (a uv workspace member). It needs NO PyAV and works on Python
# 3.12+. The SDK encoder accepts a host NV12 array OR a __cuda_array_interface__ GPU
# frame, so CuPy is NOT required here — add [gpu-cuda13]/[gpu-cuda12] for the zero-copy
# GPU-frame path. Markered to Linux/x86_64 so it is a no-op elsewhere (runtime probe:
# nvenc_gpu_pdum_available()). See docs/nvenc_sdk_evaluation.md.
gpu-nvenc-sdk = [
    "habemus-papadum-nvenc>=0.3.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",  # a floor; the == is the marker's
]
# `pdum-rfb doctor` / `pdum-rfb benchmark` diagnostics CLI.
cli = [
    "typer>=0.12",
    "rich>=13.7",
]
# `pdum-rfb doctor` with every encoder that can run on the current platform installed, so
# a fresh `uvx --from 'habemus-papadum-rfb[doctor]' pdum-rfb doctor` reports what is
# actually importable here (not just "install X"). Compound/self-referencing: the native
# packages (mac-vt/gpu-nvenc-sdk) carry platform markers, so this ONE spec installs vtenc
# on macOS and nvenc on Linux and skips the other with no error. CuPy is intentionally
# excluded (large; the SDK path doesn't need it) — doctor still reports it as installable.
doctor = [
    "habemus-papadum-rfb[cli,h264,mac-vt,gpu-nvenc-sdk]",
]
rendercanvas = [
    "rendercanvas>=2.0",
]
# Mount the framebuffer inside an existing Starlette/FastAPI (ASGI) app over the
# same Display/RfbSession core, so it shares the app's origin and session/OAuth
# cookie. Purely opt-in: the standalone serve() path (zero-extra-deps websockets
# listener) is unchanged. See docs/asgi.md.
asgi = [
    "starlette>=0.37",
]
# macOS hardware H.264 via Apple VideoToolbox — the sibling package habemus-papadum-vtenc
# (import pdum.vtenc), built from packages/vtenc/ (a uv workspace member). It needs NO
# PyAV and works on Python 3.12+; the runtime requirement is just macOS (the VideoToolbox
# frameworks are system-provided). The natural GPU frame producer is MLX (see the mac-dev
# group). See docs/mlx_metal_videotoolbox_encoder_design.md.
mac-vt = [
    "habemus-papadum-vtenc>=0.3.0 ; sys_platform == 'darwin' and platform_machine == 'arm64'",  # a floor; the == is the marker's
]
# `pdum-rfb demo` — a self-contained web app. One Python process serves the prebuilt SPA
# (built under src/pdum/rfb/static/demo/ via `pnpm -C widgets build:demo`; a git-ignored
# build artifact force-included into the wheel, not committed), a REST control plane, and the
# framebuffer WebSocket(s) over one uvicorn origin; the browser holds the viewer + all controls. No
# Node/Vite at runtime. Meant for `uvx --from 'habemus-papadum-rfb[demo]' pdum-rfb demo`.
# A dev/eval harness, not a runtime dep. Compound/self-referencing: pulls the CLI, the CPU
# H.264 (av) + native HW encoders (each markered to its platform, so one spec works on
# macOS and Linux), the ASGI server, httpx (Starlette TestClient, used by --smoke), the
# anywidget viewer, and Jupyter + marimo so the notebook demos (docs/demos/{jupyter,marimo}-demo)
# run out of the box.
demo = [
    "habemus-papadum-rfb[cli,h264,mac-vt,gpu-nvenc-sdk,anywidget]",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "jupyter>=1.1",
    "marimo>=0.9",
]
# Jupyter/marimo notebook widget (pdum.rfb.notebook). The prebuilt, inlined-worker ESM
# bundle ships in the wheel (src/pdum/rfb/static/widget.{js,css}); this pulls the Python
# runtime. See docs/notebook.md.
anywidget = [
    "anywidget>=0.9",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# pdum is a PEP 420 namespace (no src/pdum/__init__.py) shared with the sibling
# habemus-papadum-nvenc package, which contributes pdum.nvenc.
packages = ["src/pdum"]

# The demo notebooks (source of truth in docs/demos/) ride into the wheel here as package data
# so `pdum-rfb jupyter-demo` / `marimo-demo` can find + launch them from an installed wheel
# (`cli._notebook_asset` falls back to docs/demos/ in a dev checkout). These files ARE committed,
# so a plain force-include is safe.
[tool.hatch.build.targets.wheel.force-include]
"docs/demos/jupyter-demo.ipynb" = "pdum/rfb/notebooks/jupyter-demo.ipynb"
"docs/demos/marimo-demo.py" = "pdum/rfb/notebooks/marimo-demo.py"

# NEITHER the anywidget bundle (src/pdum/rfb/static/widget.{js,css}) NOR the `pdum-rfb demo` SPA
# (src/pdum/rfb/static/demo/) is committed — both are git-ignored build artifacts, produced on
# demand (`pnpm -C widgets build:anywidget` / `build:demo`; ship runs both as this package's
# `before-build` commands, see [tool.ship.packages] below). `artifacts` un-ignores them for hatch,
# so they ride in the sdist and the wheel when present and are simply absent otherwise (a
# force-include would fail every build, including `uv sync`, whenever one is missing). ship builds
# with `uv build`, which builds the wheel FROM the sdist, so the sdist must carry them too. Absent →
# the widget renders its fallback cell and `pdum-rfb demo` serves its "build me" placeholder.
[tool.hatch.build]
artifacts = [
    "src/pdum/rfb/static/widget.js",
    "src/pdum/rfb/static/widget.css",
    "src/pdum/rfb/static/demo/",
]

[tool.uv]
# Groups installed automatically by a bare `uv sync` (including `--frozen`). `viz` pulls
# the dev render stack (rendercanvas + wgpu + pygfx) onto a dev box so the rendercanvas
# backend can be exercised locally. CI's plain `uv sync --frozen` will include it too;
# pass `--no-group viz` in CI to keep it lean.
default-groups = ["dev", "viz"]

# --- uv workspace: this repo hosts habemus-papadum-rfb (root) + packages/* ---
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
habemus-papadum-nvenc = { workspace = true }
habemus-papadum-vtenc = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.3",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.0",
    "mkdocstrings>=0.26.1",
    "mkdocstrings-python>=1.11.1",
    "mkdocs-jupyter>=0.25.1",
    "jupyter>=1.1.1",
    "rich>=13.7.1",
    "pre-commit>=3.7.0",
    "watchdog>=3.0.0",
    "av>=17.1.0",
    "anywidget>=0.9",
    "pytest-asyncio>=1.4.0",
    "typer>=0.12",
    "starlette>=0.37",  # the [asgi] adapter + the `pdum-rfb demo` control plane (TestClient in tests)
    "uvicorn>=0.30",  # serves the `pdum-rfb demo` web app
    "marimo>=0.23.13",
    "habemus-papadum-ship>=0.8.0",
]
gpu-dev = [
    "cupy-cuda13x>=14",
]
# Dev-box-only (macOS) MLX so the VideoToolbox backend can be exercised end-to-end
# (render frames in MLX -> NV12 -> VtEncoder). MLX is the example/test frame producer,
# not a shipped runtime dep of the library. Mirrors gpu-dev.
mac-dev = [
    "mlx>=0.21; sys_platform == 'darwin'",
]
# Dev-box-only render stack (NOT shipped) to exercise the rendercanvas backend end-to-end.
# The library's runtime dep is just the `[rendercanvas]` extra; wgpu/pygfx are dev tooling.
viz = [
    "rendercanvas>=2.0",
    "wgpu>=0.19",
    "pygfx>=0.2",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = []

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s"
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/pdum/rfb"]
relative_files = true
omit = [
    "*/tests/*",
    "*/testing.py",
]

# ship releases this package: one version per package, the tag is the truth,
# the manifest carries <last release>+dev between releases. See the README.
[tool.ship]
ours = ["habemus-papadum-*", "@habemus-papadum/*"]
shared-paths = [".github/workflows/**", "widgets/pnpm-workspace.yaml"]
# The old pipeline's post-release commit ("back to dev (0.3.0+dev)") is not a change.
ignore-subjects = ["back to dev"]
# The pnpm workspace is nested: widgets/package.json is @habemus-papadum/rfb-widgets and
# widgets/pnpm-workspace.yaml lists the wrappers.
pnpm-root = "widgets"

# The wheel packs the anywidget bundle and the demo SPA, built from the pnpm workspace.
[tool.ship.packages."habemus-papadum-rfb"]
before-build = ["pnpm -C widgets build:anywidget", "pnpm -C widgets build:demo"]

# Platform wheels the release runner cannot build: ship versions, tests, tags and pushes;
# build-nvenc-sdk-wheel.yml / build-vtenc-wheel.yml build and publish from the tag.
[tool.ship.packages."habemus-papadum-nvenc"]
build = false

[tool.ship.packages."habemus-papadum-vtenc"]
build = false
