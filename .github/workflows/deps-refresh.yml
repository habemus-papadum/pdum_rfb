name: weekly-dependencies
on:
  schedule:
    - cron: '7 9 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ship-release
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.17'
          python-version: '3.14'
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: widgets/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install software Vulkan for CPU rendering tests
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - uses: habemus-papadum/pdum_ship/.github/actions/refresh@132af447b7055d512049f38cab45ab0da1585705
        with:
          ci_workflow: ci.yml
