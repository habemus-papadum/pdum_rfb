# Releases run through ship (habemus-papadum-ship): this caller hands the inputs to the
# reusable workflow, which waits for ci.yml on the commit, then runs `uv run ship release`.
# Each package has its own version and tag series (`<package>-v<version>`); npm packages
# are named by their scoped name (`@habemus-papadum/rfb-react`).
#
# habemus-papadum-nvenc and habemus-papadum-vtenc are `build = false` in [tool.ship]: ship
# versions, tests, tags and pushes them, and build-nvenc-sdk-wheel.yml / build-vtenc-wheel.yml
# build and publish the platform wheels from the tag. A tag pushed with the workflow token
# does not fire another workflow's `push: tags:` trigger, so the `build-wheels` job below
# dispatches the matching build workflow for the tag ship just created.
name: release
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release (npm packages by their scoped name)
        type: string
        required: true
      bump:
        description: patch, minor or major, applied to the last release tag
        type: choice
        options: [patch, minor, major]
        default: minor
      dry_run:
        description: Plan and print; write nothing
        type: boolean
        default: true
      skip_ci_check:
        description: Release without waiting for the CI workflow
        type: boolean
        default: false
      skip_tests:
        description: Do not run the test commands before publishing
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  release:
    uses: habemus-papadum/pdum_ship/.github/workflows/release.yml@main
    with:
      package: ${{ inputs.package }}
      bump: ${{ inputs.bump }}
      dry_run: ${{ inputs.dry_run }}
      skip_ci_check: ${{ inputs.skip_ci_check }}
      skip_tests: ${{ inputs.skip_tests }}
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: write
      actions: read
      id-token: write   # npm provenance attestations

  build-wheels:
    name: dispatch the platform wheel build for the new tag
    needs: release
    if: ${{ !inputs.dry_run && (inputs.package == 'habemus-papadum-nvenc' || inputs.package == 'habemus-papadum-vtenc') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # gh workflow run
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run the build workflow on the tag ship created
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          git fetch --tags origin
          tag=$(git tag --list "${PACKAGE}-v*" --sort=-v:refname | head -n 1)
          [ -n "$tag" ] || { echo "::error::no ${PACKAGE}-v* tag found"; exit 1; }
          case "$PACKAGE" in
            habemus-papadum-nvenc) workflow=build-nvenc-sdk-wheel.yml ;;
            habemus-papadum-vtenc) workflow=build-vtenc-wheel.yml ;;
          esac
          echo "dispatching $workflow for $tag"
          gh workflow run "$workflow" --ref main -f ref="$tag"
