# Build the VideoToolbox wheel (packages/vtenc -> habemus-papadum-vtenc) across CPython
# versions and upload them as an artifact. The macOS analog of build-nvenc-sdk-wheel.yml.
#
# Two entry points:
#   * workflow_dispatch — build-only validation.
#   * workflow_call     — reused by release.yml, which downloads the `vtenc-wheels`
#                         artifact and publishes it to PyPI via trusted publishing.
# This workflow itself never publishes.
#
# Runner: GitHub-hosted macOS Apple Silicon (arm64). Xcode Command Line Tools (clang +
# macOS SDK frameworks: VideoToolbox/CoreVideo/CoreMedia) are preinstalled; delocate is
# pulled on the fly by build-wheel.sh via `uv run --with`. The extension links only system
# frameworks, so the wheel bundles nothing — delocate just retags to macosx_12_0_arm64.
# arm64 only (no x86_64/universal2), matching the published layout.
name: build-vtenc-wheel

on:
  workflow_dispatch:
    inputs:
      python_versions:
        description: "Space-separated CPython versions to build"
        default: "3.12 3.13 3.14"
      ref:
        description: "Git ref (tag/branch/SHA) to build; empty = the triggering ref"
        default: ""
  workflow_call:
    inputs:
      python_versions:
        description: "Space-separated CPython versions to build"
        type: string
        default: "3.12 3.13 3.14"
      ref:
        description: "Git ref (tag/branch/SHA) to build; empty = the caller's ref. release.yml
          passes the freshly-cut vX.Y.Z tag so the wheels carry the release version."
        type: string
        default: ""

jobs:
  build:
    runs-on: macos-14 # Apple Silicon (arm64); MLX-adjacent, arm64-only wheels
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build wheel(s)
        working-directory: packages/vtenc
        run: |
          PYTHON_VERSIONS="${{ inputs.python_versions }}" ./build-wheel.sh

      - name: Upload wheels (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: vtenc-wheels
          path: packages/vtenc/dist/*.whl
