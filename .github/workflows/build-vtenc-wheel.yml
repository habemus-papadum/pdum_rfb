# Build the VideoToolbox wheel (packages/vtenc -> habemus-papadum-vtenc) across CPython
# versions and upload them as an artifact; on a release tag, publish them. The macOS analog
# of build-nvenc-sdk-wheel.yml.
#
# habemus-papadum-vtenc is `build = false` for ship (pyproject.toml [tool.ship.packages]):
# `ship release habemus-papadum-vtenc` writes the version, tests, commits, tags
# `habemus-papadum-vtenc-v<version>`, pushes and creates the GitHub release, and this
# workflow builds the arm64 wheels from that tag and publishes them. Entry points:
#   * push of a `habemus-papadum-vtenc-v*` tag (a tag pushed from a developer machine);
#   * workflow_dispatch with `ref` = that tag (what release.yml's `build-wheels` job does,
#     because a tag pushed with the workflow token fires no `push:` trigger);
#   * workflow_dispatch / workflow_call with any other ref — build-only validation.
# The `publish` job runs only when the ref being built is a habemus-papadum-vtenc-v* tag.
#
# Runner: GitHub-hosted macOS Apple Silicon (arm64). Xcode Command Line Tools (clang +
# macOS SDK frameworks: VideoToolbox/CoreVideo/CoreMedia) are preinstalled; delocate is
# pulled on the fly by build-wheel.sh via `uv run --with`. The extension links only system
# frameworks, so the wheel bundles nothing — delocate just retags to macosx_12_0_arm64.
# arm64 only (no x86_64/universal2), matching the published layout.
name: build-vtenc-wheel

on:
  push:
    tags: ["habemus-papadum-vtenc-v*"]
  workflow_dispatch:
    inputs:
      python_versions:
        description: "Space-separated CPython versions to build"
        default: "3.12 3.13 3.14"
      ref:
        description: "Git ref (tag/branch/SHA) to build; empty = the triggering ref"
        default: ""
  workflow_call:
    inputs:
      python_versions:
        description: "Space-separated CPython versions to build"
        type: string
        default: "3.12 3.13 3.14"
      ref:
        description: "Git ref (tag/branch/SHA) to build; empty = the caller's ref. release.yml
          passes the freshly-cut vX.Y.Z tag so the wheels carry the release version."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14 # Apple Silicon (arm64); MLX-adjacent, arm64-only wheels
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # `inputs` is empty on a tag push, so the full matrix is the fallback.
      - name: Build wheel(s)
        working-directory: packages/vtenc
        run: |
          PYTHON_VERSIONS="${{ inputs.python_versions || '3.12 3.13 3.14' }}" ./build-wheel.sh

      - name: Upload wheels (artifact)
        uses: actions/upload-artifact@v6
        with:
          name: vtenc-wheels
          path: packages/vtenc/dist/*.whl

  publish:
    name: publish to PyPI and attach to the GitHub release
    needs: [build]
    # The ref being built is a release tag: either the pushed tag or the `ref` input.
    if: ${{ startsWith(github.ref, 'refs/tags/habemus-papadum-vtenc-v') || startsWith(inputs.ref, 'habemus-papadum-vtenc-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release upload
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - uses: actions/download-artifact@v7
        with:
          name: vtenc-wheels
          path: dist

      - name: Publish to PyPI
        # --check-url makes a re-run of this workflow for the same tag skip files PyPI already
        # has (a failed build is re-run for the tag; the release is not cut again).
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/ dist/*.whl

      - name: Attach the wheels to the GitHub release ship created
        run: gh release upload "$TAG" dist/*.whl --clobber
