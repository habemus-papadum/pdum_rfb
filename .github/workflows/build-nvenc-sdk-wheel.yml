# Build the NVENC SDK wheel (packages/nvenc -> habemus-papadum-nvenc) across CPython
# versions and upload them as an artifact.
#
# Two entry points:
#   * workflow_dispatch — build-only validation (rarely needed; expensive).
#   * workflow_call     — reused by release.yml, which downloads the `nvenc-sdk-wheels`
#                         artifact and publishes it to PyPI via trusted publishing.
# This workflow itself never publishes.
#
# No GPU is needed to BUILD (we link the CUDA driver stub; libnvidia-encode is
# dlopen'd at runtime). The wheel can't be self-tested here (no GPU on GitHub
# runners) — validate on a GPU box with `pdum-rfb doctor`, or via the weekly
# gpu-tests workflow.
name: build-nvenc-sdk-wheel

on:
  workflow_dispatch:
    inputs:
      python_versions:
        description: "Space-separated CPython versions to build"
        default: "3.12 3.13 3.14"
      use_nvtx:
        description: "Build a profiling wheel (NVTX ranges on)"
        type: boolean
        default: false
      ref:
        description: "Git ref (tag/branch/SHA) to build; empty = the triggering ref"
        default: ""
  workflow_call:
    inputs:
      python_versions:
        description: "Space-separated CPython versions to build"
        type: string
        default: "3.12 3.13 3.14"
      use_nvtx:
        description: "Build a profiling wheel (NVTX ranges on)"
        type: boolean
        default: false
      ref:
        description: "Git ref (tag/branch/SHA) to build; empty = the caller's ref. release.yml
          passes the freshly-cut vX.Y.Z tag so the wheels carry the release version."
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    # manylinux_2_28 + CUDA toolkit (NVIDIA's own base) -> broadly-compatible wheels
    # (manylinux_2_28 installs on RHEL8 / Ubuntu 18.10+), unlike a stock-Ubuntu build.
    # The 13.0 NVENC ABI builds fine here: its headers are vendored, not from the toolkit.
    container: sameli/manylinux_2_28_x86_64_cuda_12.3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `inputs` is populated for BOTH workflow_dispatch and workflow_call (unified context).
      - name: Build wheel(s)
        working-directory: packages/nvenc
        run: |
          ARGS=""
          [ "${{ inputs.use_nvtx }}" = "true" ] && ARGS="--nvtx"
          PYTHON_VERSIONS="${{ inputs.python_versions }}" ./build-wheel.sh $ARGS

      - name: Upload wheels (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: nvenc-sdk-wheels
          path: packages/nvenc/dist/*.whl
