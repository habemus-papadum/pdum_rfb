# Build the NVENC SDK wheel (packages/nvenc -> habemus-papadum-nvenc) across CPython
# versions and upload them as an artifact; on a release tag, publish them.
#
# habemus-papadum-nvenc is `build = false` for ship (pyproject.toml [tool.ship.packages]):
# `ship release habemus-papadum-nvenc` writes the version, tests, commits, tags
# `habemus-papadum-nvenc-v<version>`, pushes and creates the GitHub release, and this
# workflow builds the manylinux wheels from that tag and publishes them. Entry points:
#   * push of a `habemus-papadum-nvenc-v*` tag (a tag pushed from a developer machine);
#   * workflow_dispatch with `ref` = that tag (what release.yml's `build-wheels` job does,
#     because a tag pushed with the workflow token fires no `push:` trigger);
#   * workflow_dispatch / workflow_call with any other ref — build-only validation.
# The `publish` job runs only when the ref being built is a habemus-papadum-nvenc-v* tag.
#
# No GPU is needed to BUILD (we link the CUDA driver stub; libnvidia-encode is
# dlopen'd at runtime). The wheel can't be self-tested here (no GPU on GitHub
# runners) — validate on a GPU box with `pdum-rfb doctor`, or via the weekly
# gpu-tests workflow.
name: build-nvenc-sdk-wheel

on:
  push:
    tags: ["habemus-papadum-nvenc-v*"]
  workflow_dispatch:
    inputs:
      python_versions:
        description: "Space-separated CPython versions to build"
        default: "3.12 3.13 3.14"
      use_nvtx:
        description: "Build a profiling wheel (NVTX ranges on)"
        type: boolean
        default: false
      ref:
        description: "Git ref (tag/branch/SHA) to build; empty = the triggering ref"
        default: ""
  workflow_call:
    inputs:
      python_versions:
        description: "Space-separated CPython versions to build"
        type: string
        default: "3.12 3.13 3.14"
      use_nvtx:
        description: "Build a profiling wheel (NVTX ranges on)"
        type: boolean
        default: false
      ref:
        description: "Git ref (tag/branch/SHA) to build; empty = the caller's ref. release.yml
          passes the freshly-cut vX.Y.Z tag so the wheels carry the release version."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # manylinux_2_28 + CUDA toolkit (NVIDIA's own base) -> broadly-compatible wheels
    # (manylinux_2_28 installs on RHEL8 / Ubuntu 18.10+), unlike a stock-Ubuntu build.
    # The 13.0 NVENC ABI builds fine here: its headers are vendored, not from the toolkit.
    container: sameli/manylinux_2_28_x86_64_cuda_12.3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # `inputs` is populated for BOTH workflow_dispatch and workflow_call (unified context);
      # on a tag push it is empty, so the full matrix is the fallback.
      - name: Build wheel(s)
        working-directory: packages/nvenc
        run: |
          ARGS=""
          [ "${{ inputs.use_nvtx }}" = "true" ] && ARGS="--nvtx"
          PYTHON_VERSIONS="${{ inputs.python_versions || '3.12 3.13 3.14' }}" ./build-wheel.sh $ARGS

      - name: Upload wheels (artifact)
        uses: actions/upload-artifact@v6
        with:
          name: nvenc-sdk-wheels
          path: packages/nvenc/dist/*.whl

  publish:
    name: publish to PyPI and attach to the GitHub release
    needs: [build]
    # The ref being built is a release tag: either the pushed tag or the `ref` input.
    if: ${{ startsWith(github.ref, 'refs/tags/habemus-papadum-nvenc-v') || startsWith(inputs.ref, 'habemus-papadum-nvenc-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release upload
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - uses: actions/download-artifact@v7
        with:
          name: nvenc-sdk-wheels
          path: dist

      - name: Publish to PyPI
        # --check-url makes a re-run of this workflow for the same tag skip files PyPI already
        # has (a failed build is re-run for the tag; the release is not cut again).
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/ dist/*.whl

      - name: Attach the wheels to the GitHub release ship created
        run: gh release upload "$TAG" dist/*.whl --clobber
