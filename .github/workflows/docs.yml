name: Deploy static content to Pages

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy_docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 35 # backstop > the deploy-pages timeout below
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Project Setup
        run: ./scripts/setup.sh

      - name: Generate Docs
        run: uv run mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # The build+upload is fast; the time is spent polling GitHub's Pages backend while the
          # deployment sits in `deployment_queued`. The action's default timeout is 10 min (600000
          # ms) — recent runs crept 6m -> 9m53s -> 10m46s(fail) as the backend queued. Give it
          # room so transient Pages-backend slowness doesn't fail an otherwise-good deploy.
          timeout: 1800000 # 30 min (ms)
